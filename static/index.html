<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Wash — AI 角色卡清洗工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@300;400;500;700&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ══════════════════════════════════════════════════════════════════════════ -->
<!--  Header                                                                   -->
<!-- ══════════════════════════════════════════════════════════════════════════ -->
<header class="app-header">
  <div class="header-brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <h1>Card <span class="accent">Wash</span></h1>
    <span class="version-badge">v0.1</span>
  </div>
  <p class="header-tagline">AI 角色卡版权清洗工具</p>
</header>

<!-- ══════════════════════════════════════════════════════════════════════════ -->
<!--  Steps nav                                                                -->
<!-- ══════════════════════════════════════════════════════════════════════════ -->
<nav class="steps-nav" id="stepsNav">
  <button class="step active" data-step="upload">
    <span class="step-num">1</span>
    <span class="step-label">上传</span>
  </button>
  <div class="step-line"></div>
  <button class="step" data-step="analyze" disabled>
    <span class="step-num">2</span>
    <span class="step-label">分析</span>
  </button>
  <div class="step-line"></div>
  <button class="step" data-step="rewrite" disabled>
    <span class="step-num">3</span>
    <span class="step-label">改写</span>
  </button>
  <div class="step-line"></div>
  <button class="step" data-step="export" disabled>
    <span class="step-num">4</span>
    <span class="step-label">导出</span>
  </button>
</nav>

<!-- ══════════════════════════════════════════════════════════════════════════ -->
<!--  Step 1: Upload                                                           -->
<!-- ══════════════════════════════════════════════════════════════════════════ -->
<section class="page active" id="page-upload">
  <!-- Mode toggle -->
  <div class="mode-toggle">
    <button class="mode-btn active" data-mode="single">单张处理</button>
    <button class="mode-btn" data-mode="batch">批量处理</button>
  </div>

  <!-- Single upload -->
  <div class="upload-zone" id="uploadZone">
    <div class="upload-icon">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="8" y="8" width="48" height="48" rx="8"/>
        <path d="M32 20v24M20 32l12-12 12 12"/>
      </svg>
    </div>
    <h2>拖放角色卡到这里</h2>
    <p>支持 <strong>.png</strong> (含嵌入数据) 和 <strong>.json</strong> 格式</p>
    <label class="upload-btn">
      选择文件
      <input type="file" id="fileInput" accept=".png,.json" hidden />
    </label>
  </div>

  <!-- Batch upload -->
  <div class="upload-zone batch-zone" id="batchUploadZone" style="display:none">
    <div class="upload-icon">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="4" y="12" width="44" height="40" rx="6"/>
        <rect x="12" y="6" width="44" height="40" rx="6"/>
        <path d="M34 18v20M24 28l10-10 10 10"/>
      </svg>
    </div>
    <h2>拖放多个角色卡到这里</h2>
    <p>支持同时上传多个 <strong>.png</strong> 和 <strong>.json</strong> 文件</p>
    <label class="upload-btn">
      选择文件（可多选）
      <input type="file" id="batchFileInput" accept=".png,.json" multiple hidden />
    </label>
  </div>

  <!-- Batch queue (shown after batch upload) -->
  <div id="batchQueue" style="display:none">
    <div class="batch-header">
      <h3>批量处理队列</h3>
      <span class="batch-count" id="batchCount">0 个文件</span>
    </div>
    <div class="batch-list" id="batchList"></div>

    <div class="batch-config">
      <h3>批量改写设置</h3>
      <div class="batch-config-grid">
        <div>
          <label class="form-label">提供商</label>
          <select id="batchProvider" class="form-select">
            <option value="openai">OpenAI</option>
            <option value="anthropic">Anthropic (Claude)</option>
            <option value="openai_compatible">OpenAI 兼容 (Ollama 等)</option>
          </select>
        </div>
        <div>
          <label class="form-label">API Key</label>
          <input type="password" id="batchApiKey" class="form-input" placeholder="sk-..." />
        </div>
        <div>
          <label class="form-label">模型</label>
          <input type="text" id="batchModel" class="form-input" value="gpt-4o-mini" />
        </div>
        <div id="batchBaseUrlGroup" style="display:none">
          <label class="form-label">Base URL</label>
          <input type="text" id="batchBaseUrl" class="form-input" placeholder="http://localhost:11434/v1" />
        </div>
        <div>
          <label class="form-label">改写强度</label>
          <div class="strength-selector">
            <button class="strength-btn batch-str-btn" data-strength="light"><span class="strength-icon">~</span>轻度</button>
            <button class="strength-btn batch-str-btn active" data-strength="medium"><span class="strength-icon">~~</span>中度</button>
            <button class="strength-btn batch-str-btn" data-strength="heavy"><span class="strength-icon">~~~</span>重度</button>
          </div>
        </div>
        <div>
          <label class="form-label">Temperature <span id="batchTempValue">0.7</span></label>
          <input type="range" id="batchTemp" class="form-range" min="0" max="1.5" step="0.1" value="0.7" />
        </div>
      </div>

      <div class="batch-actions">
        <button class="btn btn-primary btn-lg" id="startBatchRewrite">
          <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/></svg>
          一键批量改写
        </button>
        <div class="rewrite-loading" id="batchLoading" style="display:none">
          <div class="spinner"></div>
          <span id="batchProgress">处理中 0/0 ...</span>
        </div>
      </div>
    </div>

    <!-- Batch results -->
    <div id="batchResults" style="display:none">
      <div class="batch-header">
        <h3>处理结果</h3>
      </div>
      <div class="batch-results-list" id="batchResultsList"></div>
      <div class="batch-export-actions">
        <button class="btn btn-export" id="batchExportJson">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span>全部导出 JSON (ZIP)</span>
        </button>
        <button class="btn btn-export" id="batchExportPng">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <span>全部导出 PNG (ZIP)</span>
        </button>
      </div>
      <button class="btn btn-outline" id="batchStartOver" style="margin-top:1.5rem">重新开始</button>
    </div>
  </div>
</section>

<!-- ══════════════════════════════════════════════════════════════════════════ -->
<!--  Step 2: Analyze                                                          -->
<!-- ══════════════════════════════════════════════════════════════════════════ -->
<section class="page" id="page-analyze">
  <div class="analyze-layout">
    <!-- Left: Card preview -->
    <div class="card-preview-panel">
      <div class="card-avatar-wrap">
        <img id="cardAvatar" src="" alt="" />
        <div class="card-avatar-placeholder" id="avatarPlaceholder">
          <svg viewBox="0 0 48 48" fill="currentColor"><circle cx="24" cy="18" r="10"/><path d="M4 44c0-11 8.95-20 20-20s20 9 20 20"/></svg>
        </div>
      </div>
      <h2 class="card-name" id="cardName">—</h2>
      <div class="card-meta" id="cardMeta"></div>
      <div class="risk-badge-wrap">
        <span class="risk-badge" id="overallRisk">—</span>
      </div>
      <p class="risk-summary" id="riskSummary"></p>
    </div>

    <!-- Right: Field list -->
    <div class="fields-panel">
      <h3>字段风险扫描</h3>
      <div class="fields-list" id="fieldsList"></div>
      <div class="analyze-actions">
        <button class="btn btn-primary btn-lg" id="goToRewrite">
          <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/></svg>
          开始改写
        </button>
      </div>
    </div>
  </div>
</section>

<!-- ══════════════════════════════════════════════════════════════════════════ -->
<!--  Step 3: Rewrite                                                          -->
<!-- ══════════════════════════════════════════════════════════════════════════ -->
<section class="page" id="page-rewrite">
  <div class="rewrite-layout">
    <!-- Config sidebar -->
    <aside class="rewrite-config">
      <h3>LLM 设置</h3>

      <label class="form-label">提供商</label>
      <select id="llmProvider" class="form-select">
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic (Claude)</option>
        <option value="openai_compatible">OpenAI 兼容 (Ollama 等)</option>
      </select>

      <label class="form-label">API Key</label>
      <input type="password" id="llmApiKey" class="form-input" placeholder="sk-..." />

      <label class="form-label">模型</label>
      <input type="text" id="llmModel" class="form-input" value="gpt-4o-mini" />

      <div id="baseUrlGroup" style="display:none">
        <label class="form-label">Base URL</label>
        <input type="text" id="llmBaseUrl" class="form-input" placeholder="http://localhost:11434/v1" />
      </div>

      <label class="form-label">改写强度</label>
      <div class="strength-selector">
        <button class="strength-btn" data-strength="light">
          <span class="strength-icon">~</span>
          轻度
        </button>
        <button class="strength-btn active" data-strength="medium">
          <span class="strength-icon">~~</span>
          中度
        </button>
        <button class="strength-btn" data-strength="heavy">
          <span class="strength-icon">~~~</span>
          重度
        </button>
      </div>
      <div class="strength-desc" id="strengthDesc">替换名称、地点和世界观引用，保留性格和风格。</div>

      <label class="form-label">选择要改写的字段</label>
      <div class="field-checkboxes" id="fieldCheckboxes"></div>

      <label class="form-label">Temperature <span id="tempValue">0.7</span></label>
      <input type="range" id="llmTemp" class="form-range" min="0" max="1.5" step="0.1" value="0.7" />

      <button class="btn btn-primary btn-lg" id="startRewrite" style="margin-top:1.5rem;width:100%">
        开始改写
      </button>
      <div class="rewrite-loading" id="rewriteLoading" style="display:none">
        <div class="spinner"></div>
        <span>LLM 改写中...</span>
      </div>
    </aside>

    <!-- Diff view -->
    <div class="diff-panel">
      <h3>改写对比</h3>
      <div id="diffContainer" class="diff-container">
        <div class="diff-placeholder">配置左侧参数后点击「开始改写」</div>
      </div>
    </div>
  </div>
</section>

<!-- ══════════════════════════════════════════════════════════════════════════ -->
<!--  Step 4: Export                                                           -->
<!-- ══════════════════════════════════════════════════════════════════════════ -->
<section class="page" id="page-export">
  <div class="export-layout">
    <div class="export-card-preview">
      <div class="card-avatar-wrap">
        <img id="exportAvatar" src="" alt="" />
        <div class="card-avatar-placeholder" id="exportAvatarPlaceholder">
          <svg viewBox="0 0 48 48" fill="currentColor"><circle cx="24" cy="18" r="10"/><path d="M4 44c0-11 8.95-20 20-20s20 9 20 20"/></svg>
        </div>
      </div>
      <h2 id="exportName">—</h2>
      <div class="risk-badge-wrap">
        <span class="risk-badge" id="exportRisk">—</span>
      </div>
      <p class="risk-summary" id="exportSummary"></p>
    </div>
    <div class="export-actions">
      <h3>导出清洗后的角色卡</h3>
      <p class="export-hint">选择导出格式下载</p>
      <div class="export-buttons">
        <button class="btn btn-export" id="exportJson">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <span>导出 JSON</span>
        </button>
        <button class="btn btn-export" id="exportPng">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <span>导出 PNG</span>
        </button>
      </div>
      <button class="btn btn-outline" id="startOver" style="margin-top:2rem">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/></svg>
        重新开始
      </button>
    </div>
  </div>
</section>

<!-- ══════════════════════════════════════════════════════════════════════════ -->
<!--  Toast                                                                    -->
<!-- ══════════════════════════════════════════════════════════════════════════ -->
<div class="toast-container" id="toastContainer"></div>

<script src="app.js"></script>
</body>
</html>
